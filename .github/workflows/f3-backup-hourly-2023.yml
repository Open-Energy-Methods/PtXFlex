name: F3 Stage B — original 2023 E pressure-shortage hourly backup envelope
on:
  push:
    branches: ['feat/milp-methanol-baseline']
    paths:
      - 'src/ptxflex/f3_backup_hourly_envelope.py'
      - 'tests/test_f3_backup_hourly_envelope.py'
      - '.github/workflows/f3-backup-hourly-2023.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source_hourly_h2_backup_envelope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Source: successful Stage A run 43536654454, head 489f009e164578c6eed972e0cc59cfed1ee0bd2d.
    # Immutable GitHub Actions artifact SHA-256 values independently exposed by GitHub metadata.
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: max_inventory
            artifact_id: 14089972401
            digest: 3ea60fb58c49f34c33614bfb05a294020707ebcc24d7af570cb6ab701d7eb6c8
          - mode: usable_service
            artifact_id: 14090181835
            digest: f3299f4185efe0f9ff733dd1ab807d1db02f11c08d1a2f717cffb89d009aa43c
    env:
      GH_TOKEN: ${{ github.token }}
      MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Negative and unit tests use synthetic mathematical traces only
        run: python -m pytest -q tests/test_f3_backup_hourly_envelope.py
      - name: Retrieve immutable E original 2023 source-derived Stage A ZIP with digest verification
        env:
          ARTIFACT_ID: ${{ matrix.artifact_id }}
          EXPECTED_DIGEST: ${{ matrix.digest }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/f3_h2_backstop_input
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 180 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Open-Energy-Methods/PtXFlex/actions/artifacts/$ARTIFACT_ID/zip" \
            -o /tmp/f3_h2_backstop_input/source_E_adequacy.zip
          echo "$EXPECTED_DIGEST  /tmp/f3_h2_backstop_input/source_E_adequacy.zip" | sha256sum --check
          unzip -q /tmp/f3_h2_backstop_input/source_E_adequacy.zip -d /tmp/f3_h2_backstop_input/source
      - name: Verify real original E 2023 hourly additional H2 shortfall and calculate backup demand envelope
        shell: bash
        run: |
          set -euo pipefail
          python -m ptxflex.f3_backup_hourly_envelope \
            --certificate /tmp/f3_h2_backstop_input/source/stageA_additional_shortfall_certified_interval.json \
            --hourly-trace "/tmp/f3_h2_backstop_input/source/${MODE}_E_hourly_additional_shortfall.json" \
            --mode "$MODE" \
            --output "outputs/F3_2023_original_E_source_hypothetical_backup_${MODE}.json"
          python - <<'PY'
          import json, os, pathlib, math, base64, hashlib
          p=pathlib.Path("outputs")/("F3_2023_original_E_source_hypothetical_backup_"+os.environ["MODE"]+".json")
          raw=p.read_bytes()
          x=json.loads(raw)
          assert x["schema_version"]=="ptxflex.F3_2023_hypothetical_source_hourly_H2_backup_load_envelope.v1"
          assert x["source_2023_original_E_reference_delivered_kg"]>16_000_000
          assert x["original_full_2023_modelled_demand_kg"]==18250000.
          assert x["stageA_original_MILP_min_shortage_certified_lower_bound_kg"]>0
          assert math.isclose(x["single_incumbent_hypothetical_topup_annual_kg"],
            x["stageA_original_feasible_dispatch_shortage_upper_bound_kg"],abs_tol=.0002)
          assert x["single_incumbent_hypothetical_topup_occupied_hours"]>0
          assert x["single_incumbent_hypothetical_topup_max_kg_per_hour"]>0
          assert x["incremental_backup_H2_kgCO2e_per_kg"] is None
          assert x["incremental_backup_cost_EUR_per_kg"] is None
          assert x["external_backup_supply_ramp_availability_and_reliability_verified"] is False
          assert x["matched_service_LCA_TEA_comparison_permitted"] is False
          print("BACKUP_SOURCE_DERIVED_JSON_SHA256="+hashlib.sha256(raw).hexdigest())
          print("BACKUP_SOURCE_DERIVED_JSON_BASE64="+base64.b64encode(raw).decode("ascii"))
          print("PASS: mathematically specified hourly topup service; no external supplier, cost or GWP claimed.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: F3-2023-source-modelled-E-hypothetical-H2-backup-${{ matrix.mode }}-NOT-LCA
          path: outputs/
          if-no-files-found: warn
          retention-days: 90
