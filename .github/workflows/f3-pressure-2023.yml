name: F2/F3 — original 2023 H2 pressure heel and RVO compressor duty
on:
  push:
    branches: ['feat/milp-methanol-baseline']
    paths:
      - '.github/workflows/f3-pressure-2023.yml'
      - 'src/ptxflex/pressure_storage_duty.py'
      - 'src/ptxflex/f3_matched_ideal_benchmark.py'
      - 'src/ptxflex/storage_reference_vessels.py'
      - 'src/ptxflex/hydrogen_physics.py'
      - 'tests/test_f3_pressure_storage_duty.py'
      - 'scripts/f3_physical_pressure_2023.py'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pressure_scenario_verified:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin real CoolProp EOS, HiGHS and upstream source parser
        run: python -m pip install -e '.[dev,physics,original-sources]'
      - name: Test new EOS-gas-heel/energy/pressure integration and tamper rejection
        run: python -m pytest -v tests/test_f3_pressure_storage_duty.py tests/test_hydrogen_physics_f2.py tests/test_storage_reference_vessels.py tests/test_f3_matched_ideal_benchmark.py
      - name: Retrieve immutable 2023 real ENTSO-E-price ERA5-wind PyNEXUS scenario archives (no synthetic 2023 replacement)
        run: |
          mkdir -p /tmp/frozen_PyNEXUS_2023 outputs/F3_pressure_source
          for pair in "12612294862 E.zip" "12613045475 ES.zip"; do
            set -- $pair
            curl --fail --location --retry 3 --retry-all-errors \
              --connect-timeout 20 --max-time 180 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/abhijith-sivaprasadan/PyNEXUS/actions/artifacts/$1/zip" \
              -o "/tmp/frozen_PyNEXUS_2023/$2"
          done
      - name: Examine both original 8760h scenarios with actual real-gas heel and RVO compressor duty in both maximum-versus-usable capacity interpretations
        run: |
          python scripts/f3_physical_pressure_2023.py \
            --E /tmp/frozen_PyNEXUS_2023/E.zip \
            --ES /tmp/frozen_PyNEXUS_2023/ES.zip \
            --time-limit 250 \
            --output outputs/F3_pressure_source/pressure_investigation
      - name: Audit real-source scientific status without claiming infeasible physical systems have cost data
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,math
          p=Path("outputs/F3_pressure_source/pressure_investigation/F3_pressure_screen_incremental_summary.json")
          d=json.loads(p.read_text())
          assert d["schema_version"]=="ptxflex.F3_pressure_storage_2023_source_technical_feasibility.v0.1"
          assert d["source_original_E_SHA256"]=="069455704573825f4e709e6705f5db43823722909cb93a37bd86b978636fb051"
          assert d["source_original_EplusS_SHA256"]=="cd4101fe62c3f1b8aa2d7508d3651d2fee40d2bafe6d5b87e40d5f4d055070f9"
          assert not d["v1_release_ready"] and not d["manufacturer_BOM_and_full_native_BAFU_GWP"]
          assert d["source_input_weather_and_price_identical_8760h"]
          for mode in ("max_inventory","usable_service"):
              q=d["scenarios"][mode]
              for label in ("E","E_plus_S"):
                  v=q[label]
                  assert v["source_based_screened_duty"]["vessel_count"]>0
                  assert v["source_based_screened_duty"]["gas_heel_kg"]>0
                  assert not v["source_based_screened_duty"]["includes_cooling_electricity"]
                  assert v["result_state"] in (
                    "VERIFIED_PRESSURE_SCREEN_8760h",
                    "PHYSICAL_MATCHED_SERVICE_NOT_FEASIBLE_OR_UNVERIFIED",
                    "NOT_VERIFIED_SOLVER_OR_GAP")
                  if v["result_state"]=="VERIFIED_PRESSURE_SCREEN_8760h":
                      a=v["audited_annual"]
                      assert a["hours"]==8760
                      assert a["pressure_EOS_bounds"]["EOS_hourly_mass_bounds_imply_pressure_limits"]
                      assert a["annual_compression_electricity_mwh"]>0
                      assert max(a["independent_max_physical_residuals"].values())<2e-4
                      print(mode,label,"PASS EUR2023=",a["total_wholesale_net_grid_eur2023"])
                  else:
                      assert "audited_annual" not in v
                      print(mode,label,"UNRESOLVED",v.get("failure_message",""))
              if q["matched_service_comparison"].get("valid") is not False:
                  assert q["matched_service_comparison"]["native_BAFU_comparative_GWP_complete"] is False
                  print(mode,"equal-service scientific physical-screen comparison:",q["matched_service_comparison"])
              else:
                  print(mode,"comparison NOT ELIGIBLE; no favourable cost/GWP result asserted")
          print("Real 2023 screen checked without hiding infeasible storage configurations")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 2023-E-ES-physical-heel-source-RVO-compression-screen-incomplete-plant
          path: outputs/F3_pressure_source/
          if-no-files-found: warn
          retention-days: 90
