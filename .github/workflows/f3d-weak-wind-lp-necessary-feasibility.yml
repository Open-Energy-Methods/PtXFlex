name: F3-D weaker wind — exact 2023 source matched-H2 Type I LP relaxation necessary feasibility diagnostic
on:
  push:
    branches: ['feat/milp-methanol-baseline']
    paths:
      - 'src/ptxflex/f3_matched_ideal_benchmark.py'
      - 'src/ptxflex/f3d_weak_wind_lp_feasibility.py'
      - 'tests/test_f3d_weak_wind_lp_feasibility.py'
      - '.github/workflows/f3d-weak-wind-lp-necessary-feasibility.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source_2023_no_integer_incumbent_is_LP_relaxation_infeasible_or_UNCERTAIN:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [max_inventory, usable_service]
    env:
      GH_TOKEN: ${{ github.token }}
      MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original source model & independent physical pressure EOS and numerical HiGHS
        run: python -m pip install -e '.[dev,original-sources,physics]'
      - name: Check that relaxing binaries is an LP superset — feasible LP not proof, infeasible LP necessary-condition certificate
        run: |
          python -m pytest -q tests/test_f3d_weak_wind_lp_feasibility.py tests/test_f3_matched_ideal_benchmark.py tests/test_f3d_2023_source_hourly_counterfactuals.py
      - name: Secure original E/ES and source Stage A 2023 original byte-hash audited ZIPs, without publishing inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/f3d_LP_source /tmp/f3d_LP_stageA outputs
          if [ "$MODE" = max_inventory ]; then
            STAGE_ID=14084348674
            STAGE_SHA=6731bdaeeaa01a531f577150815dcf6638c15d21bc0ccee5e9ac0fa748ffe3c8
          else
            STAGE_ID=14084937031
            STAGE_SHA=18dec140df7cab63dd9cae8836e3f23fd2dcfb0370acd48db0e36e6af81813cd
          fi
          echo "STAGE_SHA=$STAGE_SHA" >> "$GITHUB_ENV"
          for item in "12612294862 E.zip abhijith-sivaprasadan/PyNEXUS" "12613045475 ES.zip abhijith-sivaprasadan/PyNEXUS" "$STAGE_ID StageA.zip Open-Energy-Methods/PtXFlex"; do
            set -- $item
            curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 \
              -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$3/actions/artifacts/$1/zip" -o "/tmp/f3d_LP_source/$2"
          done
          echo "069455704573825f4e709e6705f5db43823722909cb93a37bd86b978636fb051  /tmp/f3d_LP_source/E.zip" | sha256sum --check
          echo "cd4101fe62c3f1b8aa2d7508d3651d2fee40d2bafe6d5b87e40d5f4d055070f9  /tmp/f3d_LP_source/ES.zip" | sha256sum --check
          echo "$STAGE_SHA  /tmp/f3d_LP_source/StageA.zip" | sha256sum --check
          unzip -q /tmp/f3d_LP_source/StageA.zip -d /tmp/f3d_LP_stageA
          test -s "/tmp/f3d_LP_stageA/${MODE}_E_hourly_additional_shortfall.json"
          echo "Original 2023 E+ES+source physical Stage A inputs authenticated; no source raw data published."
      - name: Same model 2023 8760h source exact pressure LP relaxed binary and zero feasibility objective
        shell: bash
        run: |
          set -euo pipefail
          python -m ptxflex.f3d_weak_wind_lp_feasibility \
            --E /tmp/f3d_LP_source/E.zip --ES /tmp/f3d_LP_source/ES.zip \
            --hourly-stageA "/tmp/f3d_LP_stageA/${MODE}_E_hourly_additional_shortfall.json" \
            --stageA-archive-sha256 "$STAGE_SHA" --mode "$MODE" --time-limit 180 \
            --output "outputs/F3_D_2023_${MODE}_wind090_original_source_LP_relaxation_NOT_plant_proof.json"
      - name: Preserve exact original-source LP solver status and explicit theoretical limitations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,base64,hashlib,json,pathlib
          mode=os.environ["MODE"]
          file=pathlib.Path("outputs")/f"F3_D_2023_{mode}_wind090_original_source_LP_relaxation_NOT_plant_proof.json"
          raw=file.read_bytes();d=json.loads(raw)
          assert d["schema_version"]=="ptxflex.f3d_2023_weak_wind_090_model_relaxed_LP_feasibility_status_source_locked.v1"
          assert d["mode"]==mode and d["scenario_id"]=="wind_090_multiplier" and d["source_year"]==2023
          assert d["source_observed_E_SHA256"]=="069455704573825f4e709e6705f5db43823722909cb93a37bd86b978636fb051"
          assert d["source_observed_EplusS_SHA256"]=="cd4101fe62c3f1b8aa2d7508d3651d2fee40d2bafe6d5b87e40d5f4d055070f9"
          assert d["paired_economic_preference_OR_certified_wholesale_savings_eur"] is None
          assert not d["full_LCA_LCOH_and_v1_release_passed"] and not d["actual_manufacturer_typeI_station_bom_and_compressor_lifetime_verified"]
          for name in ("E","E_plus_S"):
              s=d[name]
              assert s["LP_feasibility_objective_zero_ignores_2023_wholesale_cost"]
              assert s["LP_relaxed_binary_primal_NOT_a_valid_integer_dispatch"]
              assert not s["MILP_feasible_conclusion_permitted_from_LP_status_0"]
              assert s["all_original_hourly_electricity_H2_storage_pressure_compressor_constraints_preserved"]
              assert s["tested_hours"]==8760
              assert s["source_model_pressure_screened"]
              assert s["solver_status_code"] in (0,1,2,3,4)
              assert s["LP_relaxation_infeasible_as_reported_by_HiGHS"]==(s["solver_status_code"]==2)
          print("F3_D_LP_DIAG_SHA256="+hashlib.sha256(raw).hexdigest())
          print("F3_D_LP_DIAG_BASE64="+base64.b64encode(raw).decode("ascii"))
          print("PASS: original SHA-registered 2023 weakened 8760h weather and same H2 full physical LP source; solver status reported without fake financial saving or site claims.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: F3-D-weak-wind-2023-${{ matrix.mode }}-original-H2-LP-relaxation-necessary-feasibility-only
          path: outputs/
          retention-days: 90
