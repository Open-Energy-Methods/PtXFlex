name: MILP verification
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: ptxflex examples/illustrative_methanol.json --output /tmp/baseline.json
      - run: ptxflex examples/illustrative_methanol.json --emissions-cap-kgco2e 200 --output /tmp/capped.json
