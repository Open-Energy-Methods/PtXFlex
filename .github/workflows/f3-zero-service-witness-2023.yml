name: F3 — full-year physical 40t H2 zero-shortfall witness reconciliation
on:
  push:
    branches: ['feat/milp-methanol-baseline']
    paths:
      - 'scripts/f3_zero_service_witness_2023.py'
      - 'tests/test_f3_zero_service_witness.py'
      - '.github/workflows/f3-zero-service-witness-2023.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zero_shortfall_pressure_witness:
    strategy:
      fail-fast: false
      matrix:
        capacity_mode: [max_inventory, usable_service]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CAPACITY_MODE: ${{ matrix.capacity_mode }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,physics,original-sources]'
      - name: Contract-only mathematical tests
        run: python -m pytest -q tests/test_f3_zero_service_witness.py
      - name: Retrieve and verify the unchanged original 2023 hourly source ZIPs
        run: |
          mkdir -p /tmp/f3_reconcile_sources
          for pair in "12612294862 E.zip" "12613045475 ES.zip"; do
            set -- $pair
            curl --fail --location --retry 3 --retry-all-errors \
              --connect-timeout 20 --max-time 180 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/abhijith-sivaprasadan/PyNEXUS/actions/artifacts/$1/zip" \
              -o "/tmp/f3_reconcile_sources/$2"
          done
      - name: Independently produce E+S source-matched 2023 zero-shortage physics witness
        run: |
          python scripts/f3_zero_service_witness_2023.py \
            --E /tmp/f3_reconcile_sources/E.zip \
            --ES /tmp/f3_reconcile_sources/ES.zip \
            --mode "$CAPACITY_MODE" --time-limit 480 \
            --output outputs/F3_2023_source_full_service_witness_${CAPACITY_MODE}.json
      - name: Verify zero-shortfall physical witness claims
        run: |
          python - <<'PY'
          import os,json,pathlib,math
          p=pathlib.Path("outputs")/("F3_2023_source_full_service_witness_"+os.environ["CAPACITY_MODE"]+".json")
          d=json.loads(p.read_text())
          assert d["schema_version"]=="ptxflex.f3_2023_source_zero_additional_shortfall_witness.v1"
          assert d["reference_service_hour_count"]==8760
          assert math.isclose(d["reference_modelled_E_hourly_delivery_kg"],16335279.317376737,abs_tol=.002)
          assert d["stage_A_minimum_additional_shortfall_proven_kg"]==0.
          assert d["pressure_screened_modelled_equal_hourly_delivery_verified"]
          assert max(d["independently_audited_maximum_residuals"].values())<2e-4
          assert not d["native_incremental_storage_LCIA_or_complete_TEA"]
          print("Independent full-year E+S zero additional shortage witness verified.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: F3-2023-source-EplusS-verified-zero-shortage-${{ matrix.capacity_mode }}
          path: outputs/
          if-no-files-found: warn
          retention-days: 90
