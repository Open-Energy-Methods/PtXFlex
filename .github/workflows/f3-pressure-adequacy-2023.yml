name: F3 Stage A — original 2023 pressure-limited H2 adequacy and shortfall
# 2026-11-14: regenerate source-locked Stage A artifacts after introducing
# content-addressed full-hourly shortage evidence. Historical Stage B artifact
# IDs cannot pass the new trace digest gate and must never be grandfathered.
on:
  push:
    branches: ['feat/milp-methanol-baseline']
    paths:
      - '.github/workflows/f3-pressure-adequacy-2023.yml'
      - 'src/ptxflex/f3_pressure_adequacy.py'
      - 'src/ptxflex/f3_adequacy_certificates.py'
      - 'tests/test_f3_adequacy_certificates.py'
      - 'tests/test_f3_pressure_adequacy.py'
      - 'src/ptxflex/pressure_storage_duty.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  minimum_physical_h2_shortfall:
    strategy:
      fail-fast: false
      matrix:
        capacity_mode: [max_inventory, usable_service]
        study_case: [E, E_plus_S]
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      CAPACITY_MODE: ${{ matrix.capacity_mode }}
      STUDY_CASE: ${{ matrix.study_case }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,physics,original-sources]'
      - name: Verify Stage A mass/energy/pressure/slack conservation on explicitly synthetic MATH-only tests
        run: python -m pytest -v tests/test_f3_pressure_adequacy.py tests/test_f3_pressure_storage_duty.py tests/test_f3_adequacy_certificates.py
      - name: Retrieve original 2023 PyNEXUS E/E+S 8760h immutable historical evidence
        run: |
          mkdir -p /tmp/original_f3_source
          for pair in "12612294862 E.zip" "12613045475 ES.zip"; do
            set -- $pair
            curl --fail --location --retry 3 --retry-all-errors \
              --connect-timeout 20 --max-time 180 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/abhijith-sivaprasadan/PyNEXUS/actions/artifacts/$1/zip" \
              -o "/tmp/original_f3_source/$2"
          done
      - name: Solve minimum ADDITIONAL H2 unmet against original same-hour E delivered target for E/ES physical bank alternatives
        run: |
          python -m ptxflex.f3_pressure_adequacy \
            --E /tmp/original_f3_source/E.zip \
            --ES /tmp/original_f3_source/ES.zip \
            --time-limit 250 \
            --mode "$CAPACITY_MODE" \
            --case "$STUDY_CASE" \
            --output outputs/F3_original_2023_real_gas_adequacy
      - name: Verify all original evidence/physical shortfall claims from archived source
        run: |
          python - <<'PY'
          import json,math,pathlib
          p=pathlib.Path("outputs/F3_original_2023_real_gas_adequacy/stageA_2023_source_pressure_adequacy.json")
          d=json.loads(p.read_text())
          assert d["source_E_sha256"]=="069455704573825f4e709e6705f5db43823722909cb93a37bd86b978636fb051"
          assert d["source_EplusS_sha256"]=="cd4101fe62c3f1b8aa2d7508d3651d2fee40d2bafe6d5b87e40d5f4d055070f9"
          assert d["source_hourly_E_delivered_target_kg"]>16_000_000
          assert d["original_full_2023_H2_demand_kg"]==18_250_000
          assert d["source_electricity_NL_A44_and_wind_ERA5_real_hydrogen_modelled"]
          assert not d["complete_installation_BOM_LCA_and_TEA"]
          for mode,scenarios in d["scenario_results"].items():
              for case,r in scenarios.items():
                  assert r["status"] in ("VERIFIED_STAGE_A_MIN_ADDITIONAL_SOURCE_SHORTFALL","FEASIBLE_INCUMBENT_NOT_PROVEN_MINIMUM","NOT_CERTIFIED")
                  if r["status"] in ("VERIFIED_STAGE_A_MIN_ADDITIONAL_SOURCE_SHORTFALL","FEASIBLE_INCUMBENT_NOT_PROVEN_MINIMUM"):
                      if r["solver_optimal"]:
                          assert r["solver_gap"]<=1e-6
                      else:
                          assert r["feasible_incumbent_only_not_proven_minimum"]
                          print("Feasible incumbent but NOT proven minimum; retain open scientific gate")
                      assert r["additional_shortfall_kg"]>=-1e-5
                      assert math.isclose(r["achievable_annual_h2_under_screen_kg"]+
                           r["additional_shortfall_kg"],d["source_hourly_E_delivered_target_kg"],abs_tol=1e-4)
                      assert r["audit"]["pressure_EOS_bounds"]["EOS_hourly_mass_bounds_imply_pressure_limits"]
                      assert max(r["audit"]["independent_max_physical_residuals"].values())<2e-4
                      print(mode,case,"source-modelled extra physical shortfall kg:",r["additional_shortfall_kg"])
                  else:
                      print(mode,case,"NOT CERTIFIED; do not report as numerical result",r["reason"])
          print("F3 adequacy certificates from genuine source saved; no false matched-plant cost/GWP conclusion.")
          PY
      - name: Independently certify achieved dispatch vs MILP shortage lower bound
        run: |
          python -m ptxflex.f3_adequacy_certificates \
            --input outputs/F3_original_2023_real_gas_adequacy/stageA_2023_source_pressure_adequacy.json \
            --output outputs/F3_original_2023_real_gas_adequacy/stageA_additional_shortfall_certified_interval.json
          python - <<'PY'
          import json, math, pathlib
          p=pathlib.Path("outputs/F3_original_2023_real_gas_adequacy/stageA_additional_shortfall_certified_interval.json")
          d=json.loads(p.read_text())
          assert d["schema_version"]=="ptxflex.f3_stage_a_adequacy_certificates.v1"
          assert d["original_source_E_sha256"]=="069455704573825f4e709e6705f5db43823722909cb93a37bd86b978636fb051"
          assert d["original_source_EplusS_sha256"]=="cd4101fe62c3f1b8aa2d7508d3651d2fee40d2bafe6d5b87e40d5f4d055070f9"
          assert d["not_a_matched_service_cost_or_environmental_comparison"]
          assert not d["physical_installation_BOM_LCIA_TEA_complete"]
          for mode,cases in d["cases"].items():
              for case,r in cases.items():
                  if r["status"]=="NOT_CERTIFIED":
                      assert r["shortfall_lower_bound_kg"] is None
                      continue
                  lo=r["shortfall_lower_bound_kg"]; hi=r["shortfall_upper_bound_kg"]
                  assert 0<=lo<=hi+0.01
                  assert math.isclose(r["full_original_demand_shortfall_upper_bound_kg"],
                      d["full_original_demand_kg"]-d["reference_service_kg"]+hi,abs_tol=.001)
                  assert r["annual_operating_cost_eur"] is None
                  assert r["native_full_system_GWP_kgCO2e"] is None
          print("Source-locked Stage A mathematical shortage bounds certified; no LCA/TEA claim.")
          PY
      - name: Independently authenticate 8760h source-hourly evidence bytes against certified digest
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,re
          root=pathlib.Path("outputs/F3_original_2023_real_gas_adequacy")
          mode=os.environ["CAPACITY_MODE"]
          case=os.environ["STUDY_CASE"]
          summary=json.loads((root/"stageA_2023_source_pressure_adequacy.json").read_text())
          cert=json.loads((root/"stageA_additional_shortfall_certified_interval.json").read_text())
          s=summary["scenario_results"][mode][case]
          c=cert["cases"][mode][case]
          if c["status"]=="NOT_CERTIFIED":
              assert "hourly_evidence_sha256" not in c
              print("SOURCE_CASE_NOT_CERTIFIED: no digest or full-plant claim")
          else:
              expected=c["hourly_evidence_sha256"]
              assert re.fullmatch("[0-9a-f]{64}",expected)
              assert s["hourly_evidence_sha256"]==expected
              p=root/(mode+"_"+case+"_hourly_additional_shortfall.json")
              raw=p.read_bytes()
              assert hashlib.sha256(raw).hexdigest()==expected
              assert raw.endswith(b"\\n")
              obj=json.loads(raw)
              assert len(obj["hourly_additional_shortfall_kg"])==8760
              assert obj["derived_source_not_original_raw_prices_or_wind"] is True
              assert obj["source_E_delivered_reference_profile_is_modelled"] is True
              print("SOURCE_CASE=",mode,case)
              print("SOURCE_HOURLY_TRACE_SHA256=",expected)
              print("SOURCE_TRACE_BYTE_COUNT=",len(raw))
              print("SOURCE_STAGE_A_ARTIFACT_REQUIRES_POST_UPLOAD_ZIP_DIGEST_PIN=True")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: F3-2023-source-adequacy-${{ matrix.capacity_mode }}-${{ matrix.study_case }}-NO-plant-LCA
          path: outputs/F3_original_2023_real_gas_adequacy/
          if-no-files-found: warn
          retention-days: 90
