name: Import original observed 2023 Netherlands market and wind
on:
  push:
    branches: ['feat/milp-methanol-baseline']
    paths:
      - '.github/workflows/real-input.yml'
      - 'src/ptxflex/observed_sources.py'
      - 'src/ptxflex/cli.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download original source via GitHub API, not fixtures
        run: |
          curl -fL --retry 3 --retry-all-errors \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/abhijith-sivaprasadan/PyNEXUS/actions/artifacts/12612294862/zip" \
            -o /tmp/original_E_2023.zip
      - name: Import and validate all 8760 observed-input hours; reject missing carbon factors
        run: |
          mkdir -p outputs/real_inputs
          ptxflex /tmp/original_E_2023.zip --import-pynexus-2023-e \
            --output outputs/real_inputs/nl_wind_market_2023.json
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("outputs/real_inputs/nl_wind_market_2023.json")
          d=json.loads(p.read_text())
          assert d["row_count"]==8760
          assert len(d["hourly"])==8760
          assert d["solver_ready"] is False
          assert all(h["grid_gwp_kgco2e_mwh"] is None and
                     h["wind_gwp_kgco2e_mwh"] is None for h in d["hourly"])
          assert d["hourly"][0]["timestamp_utc"]=="2023-01-01T00:00:00Z"
          assert d["hourly"][-1]["timestamp_utc"]=="2023-12-31T23:00:00Z"
          print("source sha256",d["original_archive_sha256"])
          print("observed source hours",d["row_count"])
          print("first observation",d["hourly"][0])
          print("solver-ready intentionally false: no fabricated hourly carbon or chemistry")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ptxflex-genuine-2023-nl-wind-market-inputs
          path: outputs/real_inputs/
          if-no-files-found: error
          retention-days: 90
